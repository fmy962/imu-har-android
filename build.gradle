// 项目级 build.gradle
// 注意：依赖仓库已在 settings.gradle 的 dependencyResolutionManagement 中统一声明，
// 这里不要再写 allprojects { repositories }，否则与 FAIL_ON_PROJECT_REPOS 冲突。
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}
