name: Build Debug APK

# 触发方式：
#   1) 推送到 main/master 分支自动构建
#   2) 在 GitHub 仓库 Actions 页面点 "Run workflow" 手动触发
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK (manual, no broken 3rd-party action)
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          echo "== 下载 command-line-tools =="
          curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "== 接受 licenses =="
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          echo "== 安装 platform-tools / android-34 / build-tools 34.0.0 =="
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Download Gradle 8.5
        run: |
          set -e
          for url in \
            "https://github.com/gradle/gradle-distributions/releases/download/v8.5.0/gradle-8.5-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip" ; do
            echo "== try: $url =="
            if curl -fsSL -o /tmp/gradle.zip "$url" && unzip -tq /tmp/gradle.zip >/dev/null 2>&1; then
              echo "download OK from $url"
              break
            fi
            echo "failed, try next source"
          done
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle --version

      - name: Build Debug APK
        run: /tmp/gradle-8.5/bin/gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
