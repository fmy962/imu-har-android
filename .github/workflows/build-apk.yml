name: Build Debug APK

# 触发方式：
#   1) 推送到 main/master 分支自动构建
#   2) 在 GitHub 仓库 Actions 页面点 "Run workflow" 手动触发
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Download Gradle 8.2.2
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build Debug APK
        run: /tmp/gradle-8.2.2/bin/gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
